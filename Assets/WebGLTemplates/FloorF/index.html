<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <canvas id="loading" width="160" height="90"></canvas>
      <div id="warning"></div>
      <button id="fullscreen" title="Fullscreen / 전체 화면" aria-label="Fullscreen">&#x26F6;</button>
    </div>
    <script>
      // Floor F loading page, drawn as pixel art on a 160x90 canvas (scaled up with crisp pixels):
      // the elevator climbs 1 -> 2 -> 3 -> F -> 5 ... 9, one floor at a time, while the build loads.
      var canvas = document.querySelector("#unity-canvas");
      var stage = document.querySelector("#stage");
      var loader = document.querySelector("#loading");
      var g = loader.getContext("2d");
      var LABELS = ["1", "2", "3", "F", "5", "6", "7", "8", "9"];
      var STEP_MS = 320;          // at least this long per floor, so every floor is seen
      var HOLD_MS = 900;          // stay on 9 once loaded, then fade

      // sizing is pure CSS (style.css #stage), so a hidden-then-shown or fullscreened iframe always fits

      // Unity decodes each sound with decodeAudioData(buf, ok, fail). It handles the failure callback, but Chrome ALSO
      // returns a promise whose rejection nobody catches, and Unity's loader turns any unhandled rejection into an
      // alert(). A sound some browser can't decode must never pop up an error box: log it and carry on (registered
      // before the loader so it runs first and stops the loader's handler).
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        if (r && (r.name === "EncodingError" || /decode audio/i.test(String(r.message || r)))) {
          console.warn("[Floor F] a sound could not be decoded by this browser and was skipped:", r);
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });

      // ---- 5x7 bitmap font (rows top -> bottom, "#" = pixel)
      var FONT = {
        "F": ["#####", "#....", "#....", "####.", "#....", "#....", "#...."],
        "L": ["#....", "#....", "#....", "#....", "#....", "#....", "#####"],
        "O": [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
        "R": ["####.", "#...#", "#...#", "####.", "#.#..", "#..#.", "#...#"],
        "G": [".###.", "#...#", "#....", "#.###", "#...#", "#...#", ".###."],
        "I": ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "#####"],
        "N": ["#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#", "#...#"],
        "U": ["#...#", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
        "P": ["####.", "#...#", "#...#", "####.", "#....", "#....", "#...."],
        "1": ["..#..", ".##..", "..#..", "..#..", "..#..", "..#..", ".###."],
        "2": [".###.", "#...#", "....#", "...#.", "..#..", ".#...", "#####"],
        "3": ["####.", "....#", "....#", ".###.", "....#", "....#", "####."],
        "5": ["#####", "#....", "####.", "....#", "....#", "#...#", ".###."],
        "6": [".###.", "#....", "#....", "####.", "#...#", "#...#", ".###."],
        "7": ["#####", "....#", "...#.", "..#..", ".#...", ".#...", ".#..."],
        "8": [".###.", "#...#", "#...#", ".###.", "#...#", "#...#", ".###."],
        "9": [".###.", "#...#", "#...#", ".####", "....#", "....#", ".###."],
        "H": ["#...#", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
        "T": ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."],
        "E": ["#####", "#....", "#....", "####.", "#....", "#....", "#####"],
        "W": ["#...#", "#...#", "#...#", "#.#.#", "#.#.#", "##.##", "#...#"],
        "C": [".###.", "#...#", "#....", "#....", "#....", "#...#", ".###."],
        "M": ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"],
        ".": [".....", ".....", ".....", ".....", ".....", ".....", "..#.."],
        " ": [".....", ".....", ".....", ".....", ".....", ".....", "....."]
      };
      function glyph(ch, x, y, s, color) {
        var rows = FONT[ch] || FONT[" "];
        g.fillStyle = color;
        for (var r = 0; r < 7; r++)
          for (var c = 0; c < 5; c++)
            if (rows[r][c] === "#") g.fillRect(x + c * s, y + r * s, s, s);
      }
      function text(str, x, y, s, color) {
        for (var i = 0; i < str.length; i++) glyph(str[i], x + i * 6 * s, y, s, color);
      }
      function textWidth(str, s) { return str.length * 6 * s - s; }
      function rect(x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }

      // ---- the scene: a tiny Floor F night city. Seeded, so every load looks the same.
      var seed = 7;
      function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
      var STARS = [];
      for (var si = 0; si < 46; si++) STARS.push([Math.floor(rnd() * 160), Math.floor(rnd() * 44), rnd(), rnd() < 0.25]);
      // skyline blocks: [x, width, top y], lit windows decided once
      var CITY = [[0, 14, 52], [13, 12, 60], [24, 16, 46], [39, 11, 56], [49, 15, 50], [96, 14, 54], [109, 12, 44], [120, 16, 58], [135, 12, 49], [146, 14, 55]];
      var CITY_WIN = [];
      for (var ci = 0; ci < CITY.length; ci++) {
        var b = CITY[ci];
        for (var wy = b[2] + 3; wy < 80; wy += 4)
          for (var wx = b[0] + 2; wx < b[0] + b[1] - 2; wx += 3)
            if (rnd() < 0.3) CITY_WIN.push([wx, wy, rnd() < 0.2 ? "#9fb4d8" : "#d9b25a"]);
      }
      // hotel: x 65..95, 9 floors of 5 px from y 34 (top) to 79 (lobby floor)
      var HX = 64, HW = 32, FLOOR_H = 5, HBOTTOM = 79;
      function floorY(f) { return HBOTTOM - (f + 1) * FLOOR_H; }      // top edge of floor f (0 = lobby)

      var shown = 0, target = 0, lastStep = 0, loaded = false, loadedAt = 0, carY = 0, start = performance.now();
      var meteorAt = 2.2, signOnAt = -1;

      function drawScene(t) {
        // sky: three flat bands (no dither)
        rect(0, 0, 160, 90, "#07070f");
        rect(0, 0, 160, 18, "#0d0c1c");
        rect(0, 18, 160, 18, "#0a0a17");
        // stars: steady, a few slowly twinkling (<= 1 change / 2 s)
        for (var i = 0; i < STARS.length; i++) {
          var s0 = STARS[i], on = !s0[3] || (Math.floor(t / 2 + s0[2] * 7) % 3 !== 0);
          if (on) rect(s0[0], s0[1], 1, 1, s0[2] > 0.8 ? "#f4ecd8" : (s0[2] > 0.4 ? "#8c88b0" : "#4a4766"));
        }
        // moon with two banded halo rings
        rect(18, 9, 7, 7, "#1a1830"); rect(17, 10, 9, 5, "#1a1830"); rect(19, 8, 5, 9, "#1a1830");
        rect(19, 10, 5, 5, "#e8e2c8"); rect(20, 9, 3, 7, "#e8e2c8"); rect(18, 11, 7, 3, "#e8e2c8");
        rect(20, 11, 1, 1, "#bdb69a"); rect(22, 13, 1, 1, "#bdb69a");
        // occasional shooting star (one every ~4.5 s, 0.5 s long)
        if (t > meteorAt + 0.5) meteorAt = t + 3.5 + (Math.floor(t * 13) % 10) / 10;
        if (t >= meteorAt && t < meteorAt + 0.5) {
          var k = (t - meteorAt) / 0.5, mx = Math.round(118 + k * 30), my = Math.round(6 + k * 12);
          rect(mx, my, 1, 1, "#ffffff");
          for (var tl = 1; tl < 6; tl++) rect(mx - tl * 2, my - tl, 1, 1, tl < 3 ? "#c9d8ff" : "#5a5f8a");
        }
        // skyline + its windows
        for (var c = 0; c < CITY.length; c++) rect(CITY[c][0], CITY[c][2], CITY[c][1], 80 - CITY[c][2], c % 2 ? "#141322" : "#11101d");
        for (var w = 0; w < CITY_WIN.length; w++) rect(CITY_WIN[w][0], CITY_WIN[w][1], 1, 1, CITY_WIN[w][2]);
        // street
        rect(0, 80, 160, 10, "#0e0d16");
        rect(0, 80, 160, 1, "#2a2638");
        for (var d = 2; d < 160; d += 8) rect(d, 86, 4, 1, "#3a3550");
        // the hotel: brick body, pilasters, cornice, shaft, floors lighting up with the load
        rect(HX - 1, floorY(8) - 3, HW + 2, HBOTTOM - floorY(8) + 4, "#2a1414");
        rect(HX, floorY(8) - 2, HW, HBOTTOM - floorY(8) + 2, "#5a2a22");
        for (var f = 0; f < 9; f++) {
          var y = floorY(f), lit = f <= shown;
          rect(HX + 2, y + 1, 11, 3, lit ? (f === 3 ? "#7a3d8a" : "#c8963c") : "#1c1622");   // left room (4F glows violet)
          rect(HX + 19, y + 1, 11, 3, lit ? "#b47a3a" : "#1c1622");                          // right room
          rect(HX + 2, y + 4, 28, 1, "#3a1c18");                                              // floor band
          if (lit) { rect(HX + 3, y + 1, 1, 1, "#ffe9a8"); rect(HX + 28, y + 1, 1, 1, "#ffe9a8"); }
        }
        rect(HX + 14, floorY(8), 4, HBOTTOM - floorY(8), "#120f1a");                         // shaft
        var want = shown * FLOOR_H;
        carY += (want - carY) * 0.18;
        var cy = HBOTTOM - FLOOR_H - Math.round(carY);
        rect(HX + 14, cy + 1, 4, 4, "#e8c070"); rect(HX + 15, cy + 2, 2, 2, "#fff4c8");     // the car
        rect(HX - 2, floorY(8) - 4, HW + 4, 2, "#3a2a20");                                    // cornice
        rect(HX + 11, HBOTTOM - 3, 10, 3, "#2a1a10"); rect(HX + 12, HBOTTOM - 3, 8, 3, "#e0b860"); // lobby door light
        // HOTEL sign on the roof: dark until the car reaches the top, then it lights (one step, no flashing)
        var sx = HX + 3, sy = floorY(8) - 13;
        rect(sx - 1, sy - 1, 28, 9, "#1a0e0e");
        var signOn = signOnAt >= 0 && t >= signOnAt;
        text("HOTEL", sx, sy, 1, signOn ? "#ff5a4a" : "#3a1616");
        if (signOn) { rect(sx - 1, sy - 2, 28, 1, "#5a1a16"); rect(sx - 1, sy + 8, 28, 1, "#5a1a16"); }
      }

      function draw(now) {
        var t = (now - start) / 1000;
        if (shown === 8 && signOnAt < 0) signOnAt = t + 0.35;
        drawScene(t);

        // logo: "FLOOR" gold block letters (scale 2) with brown extrusion + red LED "F" panel
        var s = 2, lx = 80 - Math.floor((textWidth("FLOOR", s) + 6 + 18) / 2), ly = 4;
        text("FLOOR", lx + 1, ly + 1, s, "#5a3200");               // extrusion
        text("FLOOR", lx, ly, s, "#ffcf3f");
        // highlight: the top pixel row of each lit glyph cell only (a full bar turned the L into a C)
        for (var k = 0; k < 5; k++) {
          var rows = FONT["FLOOR"[k]];
          for (var rr = 0; rr < 7; rr++)
            for (var cc = 0; cc < 5; cc++)
              if (rows[rr][cc] === "#" && (rr === 0 || rows[rr - 1][cc] !== "#"))
                rect(lx + k * 12 + cc * s, ly + rr * s, s, 1, "#fff0b0");
        }
        var px = lx + textWidth("FLOOR", s) + 6;
        rect(px - 2, ly - 2, 18, 18, "#3a2a20");                    // panel frame
        rect(px - 1, ly - 1, 16, 16, "#120606");
        glyph("F", px + 2, ly, 2, "#ff4a3a");

        // indicator panel: arrow + floor label
        var floorLabel = LABELS[shown];
        // floor indicator above the lobby door: a small elevator LED panel to the right of the hotel
        var ix = 110, iy = 62;
        rect(ix - 1, iy - 1, 30, 18, "#3a2a20");
        rect(ix, iy, 28, 16, "#120606");
        var ax = ix + 4, ay = iy + 5;                              // up arrow (5 wide)
        rect(ax + 2, ay, 1, 1, "#ff7a5a"); rect(ax + 1, ay + 1, 3, 1, "#ff7a5a"); rect(ax, ay + 2, 5, 1, "#ff7a5a");
        rect(ax + 2, ay + 3, 1, 3, "#ff7a5a");
        glyph(floorLabel, ix + 13, iy + 1, 2, floorLabel === "F" ? "#ffcf3f" : "#ff4a3a");

        // hint on the street
        var dots = ".".repeat(1 + Math.floor(t * 2) % 3);
        var hint = shown === 8 ? "WELCOME" : "GOING UP" + dots;
        text(hint, 80 - Math.floor(textWidth(shown === 8 ? "WELCOME" : "GOING UP...", 1) / 2), 82, 1, shown === 8 ? "#e0b860" : "#8f8572");
      }

      function tick(now) {
        // the shown floor chases the real progress one floor at a time
        if (shown < target && now - lastStep >= STEP_MS) { shown++; lastStep = now; }
        draw(now);
        if (loaded && shown === 8) {
          if (!loadedAt || loadedAt < lastStep) loadedAt = Math.max(loadedAt, lastStep);
          if (now - loadedAt >= HOLD_MS) { fadeOut(); return; }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      function fadeOut() {
        loader.style.transition = "opacity 0.6s";
        loader.style.opacity = "0";
        setTimeout(function () { loader.style.display = "none"; }, 650);
      }

      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.className = type == "error" ? "error" : "warn";
        box.appendChild(div);
        if (type != "error") setTimeout(function () { box.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      // never wait forever on floor 1: a missing loader (bad upload / unpacked wrong) must say so
      script.onerror = function () {
        showBanner("Could not load the game files (Build/{{{ LOADER_FILENAME }}}). Please re-upload the ZIP.<br>" +
                   "게임 파일을 불러오지 못했습니다. ZIP을 다시 올려 주세요.", "error");
      };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          // floors 1..8 follow the download; 9 only once the game is ready
          target = Math.max(target, Math.min(7, Math.floor(progress * 8)));
        }).then(function (unityInstance) {
          loaded = true;
          target = 8;
          document.querySelector("#fullscreen").onclick = function () { unityInstance.SetFullscreen(1); };
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
